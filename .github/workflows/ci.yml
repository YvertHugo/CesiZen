name: CI CESIZen (Angular & Node)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-job:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances API
        run: npm ci
        working-directory: ./backend

      - name: Lancer les tests API
        run: npm test --if-present
        working-directory: ./backend

  frontend-job:
    name: Build Frontend Angular
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances Angular
        run: npm ci
        working-directory: ./frontend

      - name: Build Angular
        run: npm run build --if-present
        working-directory: ./frontend

  deploy-job:
    name: Déploiement
    runs-on: self-hosted
    needs: [backend-job, frontend-job]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Déployer en local
        run: |
          cd ~/Documents/Projet_CESI/CesiZen
          git pull origin main
          docker compose build
          docker compose up -d
