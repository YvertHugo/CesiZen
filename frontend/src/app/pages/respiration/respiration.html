<div class="respiration-container">
  <h2>Cohérence Cardiaque</h2>
  <p class="subtitle">Prenez un moment pour vous recentrer et réguler votre respiration</p>

  <div class="cercle-container">
    <div class="cercle" [class.cercle-anime]="enCours"></div>
    
    <div class="instruction-texte">
      <h3>{{ instruction }}</h3>
      <p *ngIf="enCours" class="chrono">{{ tempsRestant }}s</p>
    </div>
  </div>

  <button *ngIf="!enCours" class="btn-start" (click)="demarrer()">Démarrer l'exercice</button>
  <button *ngIf="enCours" class="btn-stop" (click)="arreter()">Arrêter l'exercice</button>
</div>
