<div class="login-container">
  <h2>Connexion CESIZen</h2>
  <p class="subtitle">Heureux de te revoir parmi nous.</p>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Adresse Email</label>
      <input type="email" id="email" formControlName="email" placeholder="exemple@cesi.fr" />
    </div>

    <div class="form-group">
      <label for="mot_de_passe">Mot de passe</label>
      <input type="password" id="mot_de_passe" formControlName="mot_de_passe" placeholder="Ton mot de passe" />
    </div>

    <button type="submit" [disabled]="loginForm.invalid">Se connecter</button>
  </form>

  <p class="message" *ngIf="message" [ngClass]="{'success': isSuccess, 'error': !isSuccess}">
    {{ message }}
  </p>
</div>
