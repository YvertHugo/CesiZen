<div class="register-container">
  <h2>Créer un compte CESIZen</h2>
  <p class="subtitle">Prends soin de ta santé mentale dès aujourd'hui.</p>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="nom">Nom</label>
      <input type="text" id="nom" formControlName="nom" placeholder="Ton nom" />
    </div>

    <div class="form-group">
      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" formControlName="prenom" placeholder="Ton prénom" />
    </div>

    <div class="form-group">
      <label for="email">Adresse Email</label>
      <input type="email" id="email" formControlName="email" placeholder="exemple@cesi.fr" />
    </div>

    <div class="form-group">
      <label for="mot_de_passe">Mot de passe</label>
      <input type="password" id="mot_de_passe" formControlName="mot_de_passe" placeholder="6 caractères minimum" />
    </div>

    <button type="submit" [disabled]="registerForm.invalid">S'inscrire</button>
  </form>

  <p class="message" *ngIf="message" [ngClass]="{'success': isSuccess, 'error': !isSuccess}">
    {{ message }}
  </p>
</div>
