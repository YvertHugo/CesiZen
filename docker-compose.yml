services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cesizen-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cesizen-web
    restart: unless-stopped
    ports:
      - "80:4000"
    depends_on:
      - backend